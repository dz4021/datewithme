<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#c8edf7" />
<meta name="description" content="猫猫和兔兔送来的一份约会邀请" />
<title>DateWithMe · 猫兔约会局</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

  :root {
    color-scheme: light;
    --paper: #dff5fb;
    --surface: #fffaf0;
    --surface-strong: #ffffff;
    --ink: #4b312d;
    --ink-soft: #684c46;
    --muted: #987e77;
    --line: #4b312d;
    --sky: #b9e6f3;
    --sky-strong: #78b9d3;
    --cream: #fff0c2;
    --cream-strong: #f5da91;
    --pink: #f7acbb;
    --pink-strong: #ed7f99;
    --grass: #bddd9f;
    --cat: #fffdf8;
    --cat-blue: #85abc7;
    --accent: #83c5dd;
    --accent-strong: #4d9ebe;
    --accent-soft: #ccecf5;
    --accent-wash: #eef9fc;
    --chip-bg: #fffefa;
    --shadow-1: 0 24px 48px -20px rgba(75, 49, 45, .28), 0 8px 0 rgba(120, 185, 211, .16);
    --shadow-2: 0 3px 0 #4b312d;
    --focus: #ed7f99;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(ellipse 90px 34px at 12% 12%, rgba(255,255,255,.9) 0 64%, transparent 66%),
      radial-gradient(ellipse 120px 42px at 88% 22%, rgba(255,255,255,.7) 0 64%, transparent 66%),
      linear-gradient(180deg, #c8edf7 0%, var(--paper) 68%, #dff2d2 100%);
    color: var(--ink);
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 16px 28px;
    position: relative;
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    z-index: -1;
    pointer-events: none;
  }
  body::before {
    width: 155px;
    height: 82px;
    left: -42px;
    bottom: -24px;
    background: var(--grass);
    border-radius: 70% 70% 0 0;
    transform: rotate(8deg);
  }
  body::after {
    width: 190px;
    height: 95px;
    right: -58px;
    bottom: -35px;
    background: #c7e8b6;
    border-radius: 65% 65% 0 0;
    transform: rotate(-7deg);
  }

  h1, h2, .display {
    font-family: 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-weight: 400;
    text-wrap: balance;
  }

  .stage {
    width: 100%;
    max-width: 448px;
    position: relative;
  }

  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,250,240,.98));
    border: 3px solid var(--line);
    border-radius: 34px;
    box-shadow: var(--shadow-1);
    padding: 20px 22px 22px;
    position: relative;
    overflow: hidden;
    min-height: min(650px, calc(100dvh - 46px));
    display: flex;
    flex-direction: column;
  }

  .deco-hearts {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .deco-hearts span {
    position: absolute;
    color: var(--pink);
    line-height: 1;
  }
  .deco-hearts span:nth-child(1) { top: 64px; right: 16px; font-size: 16px; opacity: .6; transform: rotate(10deg); }
  .deco-hearts span:nth-child(2) { bottom: 94px; left: 11px; font-size: 13px; opacity: .45; transform: rotate(-12deg); }
  .deco-hearts span:nth-child(3) { top: 47%; right: -3px; font-size: 15px; opacity: .4; transform: rotate(6deg); }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    min-height: 32px;
  }

  .back-btn {
    background: none;
    border: none;
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    margin-left: -8px;
    border-radius: 10px;
    line-height: 1;
    visibility: hidden;
  }
  .back-btn.show { visibility: visible; }
  .back-btn:hover { background: var(--accent-wash); }
  .back-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .dots {
    display: flex;
    gap: 6px;
    margin: 0 auto;
  }
  .dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-soft);
    transition: background .25s, transform .25s;
  }
  .dots span.active {
    background: var(--pink-strong);
    transform: scale(1.3);
  }
  .dots span.done { background: var(--sky-strong); }

  .spacer32 { width: 32px; }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif;
    font-size: 15px;
    letter-spacing: .02em;
    color: var(--ink-soft);
    margin: 0 auto 8px;
    width: fit-content;
    padding: 5px 11px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--cream);
    box-shadow: 0 2px 0 rgba(75,49,45,.18);
  }
  .brand .heart { font-size: 12px; color: var(--pink-strong); }

  .step {
    display: none;
    flex-direction: column;
    flex: 1;
    animation: stepIn .38s ease both;
  }
  .step.active { display: flex; }

  @keyframes stepIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .step { animation: none; }
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: .12em;
    color: var(--accent-strong);
    font-weight: 700;
    margin: 0 0 6px;
    text-transform: uppercase;
  }

  h2.title {
    font-size: clamp(22px, 6vw, 27px);
    margin: 0 0 8px;
    line-height: 1.3;
    color: var(--ink);
  }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 18px;
    line-height: 1.6;
  }

  .mascot-wrap {
    background: linear-gradient(180deg, var(--sky) 0 72%, #cce9b7 72% 100%);
    border: 3px solid var(--line);
    border-radius: 28px;
    width: min(100%, 292px);
    height: 180px;
    margin: 2px auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
    position: relative;
    box-shadow: inset 0 -5px 0 rgba(75,49,45,.06);
  }
  .mascot-wrap::before,
  .mascot-wrap::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,.84);
    border-radius: 999px;
  }
  .mascot-wrap::before { width: 76px; height: 24px; left: 24px; top: 18px; }
  .mascot-wrap::after { width: 54px; height: 18px; right: 25px; top: 35px; }
  .mascot {
    width: 282px;
    height: 176px;
    position: relative;
    z-index: 1;
    animation: bob 3.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-7px) rotate(1.5deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mascot { animation: none; }
  }

  .step-heading {
    display: grid;
    grid-template-columns: 1fr 58px;
    gap: 12px;
    align-items: start;
  }
  .step-pal {
    width: 58px;
    height: 58px;
    padding: 3px;
    border: 2px solid var(--line);
    border-radius: 18px;
    background: var(--accent-soft);
    transform: rotate(3deg);
  }
  .step-pal.rabbit { background: var(--cream); transform: rotate(-3deg); }
  .step-pal.pair { width: 76px; height: 58px; background: linear-gradient(135deg, var(--accent-soft), var(--cream)); }

  .center-block { text-align: center; }

  .btn-row {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: auto;
    padding-top: 18px;
  }
  .btn-row.inline { flex-direction: row; }

  button.btn {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 18px;
    border-radius: 999px;
    cursor: pointer;
    border: 2.5px solid var(--line);
    transition: transform .12s ease, box-shadow .12s ease, background .2s;
    -webkit-tap-highlight-color: transparent;
  }
  button.btn:active { transform: translateY(2px); }
  button.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .btn-primary {
    background: var(--pink);
    color: var(--ink);
    box-shadow: var(--shadow-2);
    flex: 1;
  }
  .btn-primary:hover { background: var(--pink-strong); }
  .btn-primary:disabled {
    opacity: .45;
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn-ghost {
    background: var(--surface-strong);
    color: var(--ink-soft);
    border-color: var(--muted);
    flex: 1;
  }
  .btn-ghost:hover { background: var(--accent-wash); color: var(--ink); }

  .teaser {
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
    margin-top: 10px;
    min-height: 16px;
    transition: opacity .2s;
  }
  .teaser.shake { animation: shake .38s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  fieldset { border: none; margin: 0; padding: 0; }
  legend {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 10px;
    padding: 0;
  }

  .field-block + .field-block { margin-top: 22px; }

  input[type="date"] {
    width: 100%;
    font-family: 'Noto Sans SC', sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 16px;
    color: var(--ink);
    background: var(--chip-bg);
    border: 2.5px solid var(--line);
    border-radius: 18px;
    padding: 13px 14px;
  }
  input[type="date"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .chip-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
  }
  .chip-wrap.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .chip {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--chip-bg);
    border: 2px solid var(--line);
    color: var(--ink);
    border-radius: 16px;
    padding: 10px 13px;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: background .15s, border-color .15s, transform .1s;
    -webkit-tap-highlight-color: transparent;
  }
  .chip:active { transform: scale(.97); }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .chip[aria-pressed="true"] {
    background: var(--cream);
    border-color: var(--line);
    font-weight: 700;
    box-shadow: inset 0 -3px 0 var(--cream-strong);
  }
  .chip[aria-pressed="true"]:not(.route-card)::before { content: "♡ "; color: var(--pink-strong); }

  .chip-time { flex: 1 1 30%; }

  .route-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
    padding: 22px 12px;
  }
  .route-card::after {
    content: "♡";
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 11px;
    color: var(--pink-strong);
    opacity: 0;
    transform: scale(.5);
    transition: opacity .15s, transform .15s;
  }
  .route-card[aria-pressed="true"]::after {
    opacity: 1;
    transform: scale(1);
  }
  .route-emoji { font-size: 26px; }
  .route-card .r-name { font-size: 15px; font-weight: 700; }
  .route-card .r-vibe { font-size: 11.5px; color: var(--muted); font-weight: 400; line-height: 1.4; }
  .route-card[aria-pressed="true"] .r-vibe { color: var(--ink-soft); }

  .recap {
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: linear-gradient(145deg, var(--accent-wash), #fff8df);
    border: 2.5px dashed var(--sky-strong);
    border-radius: 20px;
    padding: 16px 16px 14px;
    margin-bottom: 16px;
    font-variant-numeric: tabular-nums;
  }
  .recap-heading {
    font-family: 'ZCOOL KuaiLe', 'PingFang SC', sans-serif;
    font-size: 15px;
    color: var(--ink-soft);
    text-align: center;
    margin-bottom: 2px;
  }
  .recap-row { display: flex; gap: 10px; align-items: flex-start; }
  .recap-icon { font-size: 16px; line-height: 1.4; }
  .recap-label { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
  .recap-value { font-size: 14px; color: var(--ink); font-weight: 500; line-height: 1.5; }

  .copy-feedback {
    font-size: 12.5px;
    color: var(--pink-strong);
    text-align: center;
    font-weight: 700;
    height: 16px;
    margin-top: 8px;
    opacity: 0;
    transition: opacity .2s;
  }
  .copy-feedback.show { opacity: 1; }

  .hearts-fx {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    border-radius: 30px;
  }
  .hearts-fx span {
    position: absolute;
    bottom: -20px;
    font-size: 16px;
    opacity: 0;
    animation: rise 2.6s ease-in forwards;
  }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(0) scale(.6); }
    15% { opacity: .9; }
    100% { opacity: 0; transform: translateY(-420px) scale(1.1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hearts-fx { display: none; }
  }

  .footnote {
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 14px;
  }

  @media (max-width: 380px) {
    body { padding: 10px 10px 18px; }
    .card { padding: 16px 17px 18px; border-radius: 28px; }
    .mascot-wrap { height: 166px; }
    .mascot { height: 163px; }
    .btn-row.inline { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- Reusable, code-native mascots keep the whole experience in one portable HTML file. -->
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="mascot-cat" viewBox="0 0 120 120">
      <path d="M18 52L21 28C22 22 27 20 31 25L43 39C54 35 68 35 79 39L94 25C99 20 103 23 103 30L101 54C111 64 113 79 109 92C104 108 86 115 61 115C35 115 17 108 12 92C8 78 10 64 18 52Z" fill="var(--cat)" stroke="var(--line)" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M20 53L22 30C23 24 27 23 31 28L43 42C56 36 70 37 80 42L95 27C99 23 101 26 101 32L99 55C88 63 74 65 60 59L51 48C43 57 30 60 20 53Z" fill="var(--cat-blue)" stroke="var(--line)" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M31 71Q37 66 43 71" stroke="var(--line)" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M75 70Q81 68 86 72" stroke="var(--line)" stroke-width="4" stroke-linecap="round" fill="none"/>
      <ellipse cx="28" cy="84" rx="12" ry="7" fill="var(--pink)"/>
      <ellipse cx="91" cy="84" rx="12" ry="7" fill="var(--pink)"/>
      <path d="M27 81L24 87M33 80L31 87M39 81L38 87M80 81L78 87M86 80L84 87M92 81L91 87" stroke="var(--line)" stroke-width="2.3" stroke-linecap="round"/>
      <path d="M53 78Q60 86 67 78M60 84V88" stroke="var(--line)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M53 89Q60 99 67 89Z" fill="var(--pink)" stroke="var(--line)" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M18 101Q26 95 31 104M103 101Q95 95 90 104" stroke="var(--line)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    </symbol>
    <symbol id="mascot-rabbit" viewBox="0 0 120 120">
      <path d="M42 48C39 33 38 12 44 7C48 3 52 8 53 15L55 46" fill="var(--cream)" stroke="var(--line)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M66 46L67 15C68 8 73 4 77 8C83 14 80 35 78 50" fill="var(--cream)" stroke="var(--line)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M46 39C45 28 45 15 47 12M73 39C74 28 74 16 76 12" stroke="var(--pink)" stroke-width="5" stroke-linecap="round"/>
      <path d="M60 39C86 39 104 54 108 77C112 100 93 114 61 115C28 115 9 103 12 78C15 55 34 39 60 39Z" fill="var(--cream)" stroke="var(--line)" stroke-width="4.5" stroke-linejoin="round"/>
      <circle cx="42" cy="75" r="7" fill="var(--line)"/>
      <circle cx="78" cy="75" r="7" fill="var(--line)"/>
      <circle cx="44" cy="72" r="2.4" fill="white"/>
      <circle cx="80" cy="72" r="2.4" fill="white"/>
      <ellipse cx="25" cy="86" rx="10" ry="6.5" fill="var(--pink)"/>
      <ellipse cx="95" cy="86" rx="10" ry="6.5" fill="var(--pink)"/>
      <path d="M22 83L19 88M28 82L26 88M34 83L32 88M88 83L86 88M94 82L92 88M100 83L98 88" stroke="var(--line)" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M54 82Q60 89 66 82M60 88V94M60 94Q55 97 52 93M60 94Q65 98 68 93" stroke="var(--line)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </symbol>
  </defs>
</svg>

<div class="stage">
  <div class="card" id="card">
    <div class="hearts-fx" id="heartsFx" aria-hidden="true"></div>
    <div class="deco-hearts" aria-hidden="true"><span>♡</span><span>☁</span><span>♡</span></div>
    <div class="brand"><span class="heart">♡</span>DateWithMe · 猫兔约会局</div>
    <div class="topbar">
      <button class="back-btn" id="backBtn" aria-label="上一步" type="button">←</button>
      <div class="dots" id="dots"></div>
      <div class="spacer32"></div>
    </div>

    <!-- Step 0: invite -->
    <section class="step active" data-step="0">
      <div class="center-block">
        <div class="mascot-wrap">
          <svg class="mascot" viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg" aria-label="猫猫和兔兔">
            <use href="#mascot-cat" x="4" y="43" width="142" height="142"/>
            <use href="#mascot-rabbit" x="157" y="38" width="140" height="140"/>
            <path d="M150 82C144 72 128 75 130 88C132 100 150 110 150 110C150 110 168 100 170 88C172 75 156 72 150 82Z" fill="var(--pink)" stroke="var(--line)" stroke-width="4"/>
            <path d="M0 170Q42 149 83 169T166 168T250 168T320 164V195H0Z" fill="#bddd9f" opacity=".9"/>
          </svg>
        </div>
        <p class="eyebrow">一份软乎乎的邀请</p>
        <h2 class="title">可以约你出来玩吗？</h2>
        <p class="subtitle">猫猫和兔兔假装路过，其实已经等你的回答很久啦</p>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="acceptBtn" type="button">愿意呀 ♥</button>
        <button class="btn btn-ghost" id="teaseBtn" type="button">才没有很想</button>
      </div>
      <p class="teaser" id="teaserText"></p>
    </section>

    <!-- Step 1: date + time -->
    <section class="step" data-step="1">
      <div class="step-heading">
        <div>
          <p class="eyebrow">第一步 · 兔兔值班</p>
          <h2 class="title">什么时候能见到你？</h2>
          <p class="subtitle">挑一个你方便的日子，具体时间也大致定一下</p>
        </div>
        <svg class="step-pal rabbit" viewBox="0 0 120 120" aria-hidden="true"><use href="#mascot-rabbit"/></svg>
      </div>

      <div class="field-block">
        <fieldset>
          <legend>见面日期</legend>
          <input type="date" id="dateInput" />
        </fieldset>
      </div>

      <div class="field-block">
        <fieldset>
          <legend>大概几点</legend>
          <div class="chip-wrap" id="timeChips" role="group" aria-label="见面时间"></div>
        </fieldset>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="next1" type="button" disabled>继续 →</button>
      </div>
    </section>

    <!-- Step 2: mystery route -->
    <section class="step" data-step="2">
      <div class="step-heading">
        <div>
          <p class="eyebrow">第二步 · 猫猫带路</p>
          <h2 class="title">选一条约会路径</h2>
          <p class="subtitle">具体去哪先保密，选完当天见分晓</p>
        </div>
        <svg class="step-pal" viewBox="0 0 120 120" aria-hidden="true"><use href="#mascot-cat"/></svg>
      </div>
      <div class="chip-wrap pair" id="routeChips" role="group" aria-label="约会路径"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="next3" type="button" disabled>生成答案 →</button>
      </div>
    </section>

    <!-- Step 3: reveal -->
    <section class="step" data-step="3">
      <div class="step-heading">
        <div>
          <p class="eyebrow">猫兔约会局 · 匹配成功</p>
          <h2 class="title">答案都给TA了</h2>
          <p class="subtitle">把这张卡片分享回去，接下来就等见面啦</p>
        </div>
        <svg class="step-pal pair" viewBox="0 0 170 120" aria-hidden="true">
          <use href="#mascot-cat" x="0" y="8" width="94" height="94"/>
          <use href="#mascot-rabbit" x="76" y="6" width="92" height="92"/>
        </svg>
      </div>

      <div class="recap" id="recapBox"></div>

      <div class="btn-row inline">
        <button class="btn btn-primary" id="copyBtn" type="button">分享给TA</button>
        <button class="btn btn-ghost" id="resetBtn" type="button">重新选一次</button>
      </div>
      <p class="copy-feedback" id="copyFeedback">已复制到剪贴板 ✓</p>
      <p class="footnote" id="shareHint">长按 / 截图这张卡片，效果一样浪漫 (｡•ᴗ•｡)</p>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  var EMAILJS_PUBLIC_KEY = "yBE1KL4GmfsLFv1xl";
  var EMAILJS_SERVICE_ID = "service_53jwups";
  var EMAILJS_TEMPLATE_ID = "template_4gw6nxc";
  var emailSent = false;

  if (window.emailjs) {
    try { emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY }); } catch (e) {}
  }

  function sendAnswerEmail(text) {
    if (emailSent || !window.emailjs) return;
    emailSent = true;
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { message: text })
      .catch(function (err) {
        // Silent by design — she never sees this. Left in console for debugging.
        console.error("emailjs send failed", err);
      });
  }

  var TIME_OPTIONS = ["11:00", "12:30", "15:30", "18:00", "19:30", "21:00"];
  var ROUTES = [
    { e: "🐾", name: "约会路径 1", vibe: "猫猫带路，惊喜不解释" },
    { e: "🌙", name: "约会路径 2", vibe: "兔兔抽签，玄学但用心" }
  ];
  var TEASE_LINES = [
    "才怪，猫猫都看出来啦 (⁄ ⁄•⁄ω⁄•⁄ ⁄)",
    "兔兔的耳朵都等得竖起来了",
    "嘴上说不要，手指已经点过来了",
    "再装也没用哦，愿意吧～"
  ];

  var state = {
    step: 0,
    date: "",
    time: "",
    route: ""
  };

  var STORAGE_KEY = "date-signal-state-v1";
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        date: state.date, time: state.time, route: state.route
      }));
    } catch (e) {}
  }
  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      state.date = d.date || "";
      state.time = d.time || "";
      state.route = d.route || "";
    } catch (e) {}
  }

  var steps = document.querySelectorAll(".step");
  var dotsEl = document.getElementById("dots");
  var backBtn = document.getElementById("backBtn");
  var TOTAL = steps.length;

  for (var i = 0; i < TOTAL; i++) {
    var d = document.createElement("span");
    dotsEl.appendChild(d);
  }

  function renderDots() {
    var dots = dotsEl.children;
    for (var i = 0; i < dots.length; i++) {
      dots[i].className = i < state.step ? "done" : (i === state.step ? "active" : "");
    }
  }

  function goTo(n) {
    state.step = n;
    for (var i = 0; i < steps.length; i++) {
      steps[i].classList.toggle("active", parseInt(steps[i].dataset.step, 10) === n);
    }
    backBtn.classList.toggle("show", n > 0 && n < TOTAL - 1);
    renderDots();
  }

  backBtn.addEventListener("click", function () {
    if (state.step > 0) goTo(state.step - 1);
  });

  // Step 0
  var teaseBtn = document.getElementById("teaseBtn");
  var teaserText = document.getElementById("teaserText");
  teaseBtn.addEventListener("click", function () {
    teaserText.textContent = TEASE_LINES[Math.floor(Math.random() * TEASE_LINES.length)];
    teaserText.classList.remove("shake");
    void teaserText.offsetWidth;
    teaserText.classList.add("shake");
  });
  document.getElementById("acceptBtn").addEventListener("click", function () {
    goTo(1);
  });

  // Step 1
  var dateInput = document.getElementById("dateInput");
  var today = new Date();
  dateInput.min = today.toISOString().slice(0, 10);
  var timeChipsEl = document.getElementById("timeChips");
  var next1 = document.getElementById("next1");

  TIME_OPTIONS.forEach(function (t) {
    var c = document.createElement("button");
    c.type = "button";
    c.className = "chip chip-time";
    c.textContent = t;
    c.setAttribute("aria-pressed", "false");
    c.addEventListener("click", function () {
      var chips = timeChipsEl.querySelectorAll(".chip");
      chips.forEach(function (ch) { ch.setAttribute("aria-pressed", "false"); });
      c.setAttribute("aria-pressed", "true");
      state.time = t;
      checkStep1();
    });
    timeChipsEl.appendChild(c);
  });

  function checkStep1() {
    state.date = dateInput.value;
    next1.disabled = !(state.date && state.time);
    saveState();
  }
  dateInput.addEventListener("change", checkStep1);
  next1.addEventListener("click", function () { goTo(2); });

  // Step 2 — single-select mystery route
  var routeChipsEl = document.getElementById("routeChips");
  var next3 = document.getElementById("next3");
  ROUTES.forEach(function (r) {
    var c = document.createElement("button");
    c.type = "button";
    c.className = "chip route-card";
    c.setAttribute("aria-pressed", "false");
    c.innerHTML = '<span class="route-emoji">' + r.e + '</span><span class="r-name">' + r.name + '</span><span class="r-vibe">' + r.vibe + '</span>';
    c.addEventListener("click", function () {
      var chips = routeChipsEl.querySelectorAll(".chip");
      chips.forEach(function (ch) { ch.setAttribute("aria-pressed", "false"); });
      c.setAttribute("aria-pressed", "true");
      state.route = r.name;
      next3.disabled = false;
      saveState();
    });
    routeChipsEl.appendChild(c);
  });
  next3.addEventListener("click", function () {
    renderRecap();
    spawnHearts();
    sendAnswerEmail(buildCopyText());
    goTo(3);
  });

  // Step 3
  function formatDate(iso) {
    if (!iso) return "";
    var parts = iso.split("-");
    return parts[1] + "月" + parts[2] + "日";
  }

  function renderRecap() {
    var box = document.getElementById("recapBox");
    box.innerHTML = "";
    var heading = document.createElement("div");
    heading.className = "recap-heading";
    heading.textContent = "🐱🐰 DateWithMe · 答案卡";
    box.appendChild(heading);
    var rows = [
      { icon: "📅", label: "见面时间", value: formatDate(state.date) + " · " + state.time },
      { icon: "🐾", label: "选的路径", value: state.route }
    ];
    rows.forEach(function (r) {
      var row = document.createElement("div");
      row.className = "recap-row";
      row.innerHTML = '<span class="recap-icon">' + r.icon + '</span>' +
        '<span><span class="recap-label">' + r.label + '</span><br>' +
        '<span class="recap-value">' + r.value + '</span></span>';
      box.appendChild(row);
    });
  }

  function buildCopyText() {
    return "关于约会，我的答案 🐱🐰\n" +
      "📅 " + formatDate(state.date) + " · " + state.time + "\n" +
      "🐾 " + state.route + "\n" +
      "剩下的，你安排就好 (｡･ω･｡)ﾉ";
  }

  var copyFeedback = document.getElementById("copyFeedback");
  var copyBtn = document.getElementById("copyBtn");
  var shareHint = document.getElementById("shareHint");
  var canShare = !!(navigator.share);
  if (canShare) {
    copyBtn.textContent = "分享给TA";
    shareHint.textContent = "点上面按钮生成图片卡片，直接唤起微信 / 短信分享";
  } else {
    copyBtn.textContent = "复制文案";
    shareHint.textContent = "长按 / 截图这张卡片，效果一样浪漫 (｡•ᴗ•｡)";
  }

  function showFeedback(msg) {
    copyFeedback.textContent = msg;
    copyFeedback.classList.add("show");
    setTimeout(function () { copyFeedback.classList.remove("show"); }, 1800);
  }

  function fallbackCopy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showFeedback("已复制到剪贴板 ✓");
      }).catch(function () {
        showFeedback("复制失败，长按卡片截图发送吧");
      });
    } else {
      showFeedback("复制失败，长按卡片截图发送吧");
    }
  }

  function shareTextOnly(text) {
    if (canShare) {
      navigator.share({ title: "关于约会，我的答案", text: text }).catch(function (err) {
        // AbortError = she cancelled the share sheet herself, nothing to do
        if (err && err.name !== "AbortError") fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  copyBtn.addEventListener("click", function () {
    var text = buildCopyText();
    var target = document.getElementById("recapBox");

    if (!window.html2canvas) { shareTextOnly(text); return; }

    html2canvas(target, { backgroundColor: null, scale: 2 }).then(function (canvas) {
      canvas.toBlob(function (blob) {
        if (!blob) { shareTextOnly(text); return; }
        var file = new File([blob], "date-answer.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: "关于约会，我的答案", text: text })
            .catch(function (err) {
              if (err && err.name !== "AbortError") shareTextOnly(text);
            });
        } else {
          shareTextOnly(text);
        }
      }, "image/png");
    }).catch(function () {
      shareTextOnly(text);
    });
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    state.date = ""; state.time = ""; state.route = "";
    dateInput.value = "";
    [timeChipsEl, routeChipsEl].forEach(function (wrap) {
      wrap.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", "false"); });
    });
    next1.disabled = true; next3.disabled = true;
    emailSent = false;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    goTo(0);
  });

  function spawnHearts() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var fx = document.getElementById("heartsFx");
    var glyphs = ["💗", "🐾", "✨", "🌸"];
    for (var i = 0; i < 8; i++) {
      (function (i) {
        setTimeout(function () {
          var s = document.createElement("span");
          s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
          s.style.left = (10 + Math.random() * 80) + "%";
          s.style.animationDuration = (2.2 + Math.random() * 1.2) + "s";
          fx.appendChild(s);
          setTimeout(function () { s.remove(); }, 3600);
        }, i * 140);
      })(i);
    }
  }

  loadState();
  if (state.date) dateInput.value = state.date;
  if (state.time) {
    timeChipsEl.querySelectorAll(".chip").forEach(function (chip) {
      chip.setAttribute("aria-pressed", String(chip.textContent === state.time));
    });
  }
  if (state.route) {
    routeChipsEl.querySelectorAll(".chip").forEach(function (chip) {
      var selected = chip.querySelector(".r-name").textContent === state.route;
      chip.setAttribute("aria-pressed", String(selected));
    });
  }
  next1.disabled = !(state.date && state.time);
  next3.disabled = !state.route;
  goTo(0);
})();
</script>
</body>
</html>
